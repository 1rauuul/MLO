<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura de MLO — Introducción a la Ingeniería de Software</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · MLO · Offline-first</p>
    <h1>Arquitectura de MLO — Introducción a la Ingeniería de Software</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-mlo-title arquitectura-mlo-desc">
        <title id="arquitectura-mlo-title">Arquitectura MVVM offline-first de MLO</title>
        <desc id="arquitectura-mlo-desc">Capa de presentación que consume hooks de viewmodel, los cuales usan repositorios que leen y escriben en una base expo-sqlite local; los modelos definen el esquema que los repositorios consultan.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ZONES -->
        <rect x="96" y="48" width="768" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="108" y="52" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="163" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PRESENTACIÓN</text>

        <rect x="96" y="200" width="768" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="108" y="204" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="156" y="213" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">VIEWMODEL</text>

        <rect x="96" y="352" width="768" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="108" y="356" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="136" y="365" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DATOS</text>

        <!-- ARROWS (drawn before boxes) -->
        <!-- A1: Pantallas -> Hooks -->
        <line x1="266" y1="148" x2="266" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A2: Componentes -> Hooks -->
        <path d="M 620,148 V 172 Q 620,180 612,180 H 328 Q 320,180 320,188 V 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A3: Lógica -> Hooks -->
        <line x1="540" y1="278" x2="436" y2="278" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A4: Hooks -> Repositorios -->
        <line x1="266" y1="300" x2="266" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A5: Modelos -> Repositorios -->
        <line x1="540" y1="420" x2="436" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A6: Repositorios -> expo-sqlite (focal) -->
        <line x1="400" y1="448" x2="400" y2="470" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- ARROW LABELS -->
        <rect x="276" y="336" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="302" y="345" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONSULTA</text>
        <rect x="412" y="449" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="446" y="458" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LEE / ESCRIBE</text>

        <!-- NODES -->
        <!-- N1 Pantallas & rutas -->
        <rect x="96" y="92" width="340" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="92" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="104" y="98" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="121" y="107" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
        <text x="266" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pantallas &amp; rutas</text>
        <text x="266" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/app · Expo Router</text>

        <!-- N2 Componentes RN -->
        <rect x="540" y="92" width="324" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="92" width="324" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="548" y="98" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="565" y="107" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="702" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Componentes RN</text>
        <text x="702" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/components · theme</text>

        <!-- N3 Hooks de negocio -->
        <rect x="96" y="244" width="340" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="244" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="104" y="250" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="127" y="259" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOKS</text>
        <text x="266" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Hooks de negocio</text>
        <text x="266" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/viewmodels · use*</text>

        <!-- N4 Lógica pura -->
        <rect x="540" y="244" width="324" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="244" width="324" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="548" y="250" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="568" y="259" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOGIC</text>
        <text x="702" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Lógica pura</text>
        <text x="702" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">*Logic.ts · testeable</text>

        <!-- N5 Repositorios -->
        <rect x="96" y="392" width="340" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="392" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="104" y="398" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="124" y="407" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPOS</text>
        <text x="266" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Repositorios</text>
        <text x="266" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/data/repositories</text>

        <!-- N6 Modelos & esquema -->
        <rect x="540" y="392" width="324" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="392" width="324" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="548" y="398" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="570" y="407" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODELS</text>
        <text x="702" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Modelos &amp; esquema</text>
        <text x="702" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/models · DDL</text>

        <!-- STORE focal -->
        <rect x="360" y="470" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="470" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="368" y="476" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="394" y="485" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OFFLINE</text>
        <text x="480" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">expo-sqlite</text>
        <text x="480" y="516" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mlo.db · migrateAndSeed</text>

        <!-- LEGEND -->
        <line x1="64" y1="546" x2="896" y2="546" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="64" y="560" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text>

        <rect x="150" y="552" width="16" height="16" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="174" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Almacén offline</text>

        <line x1="320" y1="560" x2="342" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="352" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Flujo de datos</text>

        <line x1="500" y1="560" x2="522" y2="560" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="532" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Flujo principal</text>
      </svg>
    </div>
  </div>
</body>
</html>

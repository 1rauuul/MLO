<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo entidad-relación de MLO</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .caption {
      font-family: var(--font-sans); font-size: 0.8rem; color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Modelo entidad-relación · MLO · Offline-first</p>
    <h1>Modelo conceptual — aprendizaje, cuenta y progreso</h1>
    <p class="caption">Las 13 tablas físicas agrupadas en 8 entidades. <em>Cuenta</em> es la raíz del clúster de autenticación y analítica; <em>Lección</em> la del clúster de contenido. <em>Progreso</em> une ambos.</p>

      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-mlo-title er-mlo-desc">

        <desc id="er-mlo-desc">Ocho entidades: la raíz Cuenta con su perfil, intentos y progreso; las unidades que contienen lecciones, actividades, evaluaciones; y el progreso que conecta cuenta y lección.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- RELATIONSHIPS (drawn before entities) -->
        <!-- R1 Cuenta -- Perfil (1:1) -->
        <line x1="160" y1="176" x2="160" y2="232" stroke="#4f5d75" stroke-width="1"/>
        <text x="150" y="189" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1</text>
        <text x="150" y="219" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1</text>
        <rect x="182" y="196" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIGURA</text>

        <!-- R2 Cuenta -- Intento (1:N), codo rodeando Perfil -->
        <path d="M 240,176 V 192 Q 240,200 248,200 H 272 Q 280,200 280,208 V 457 Q 280,465 272,465 H 264" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <text x="252" y="168" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">1</text>
        <text x="276" y="461" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">N</text>

        <text x="319" y="447" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTRA</text>

        <text x="301" y="167" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AVANZA EN</text>

        <text x="556" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">N</text>
        <text x="632" y="244" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">1</text>

        <text x="92" y="429" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENTIDAD</text>
